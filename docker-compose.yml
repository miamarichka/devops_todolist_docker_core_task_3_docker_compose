# the attribute `version` is obsolete, it will be ignored, please remove it to avoid potential confusion

networks:
  db-data-net:
    driver: bridge

services:
  mysql:
    image: mysql:latest
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: my-sql
    ports:
      - '3306:3306'
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - db-data-net

  pythonapp:
    image: app:1.2
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - APP_ENV=Development
    networks:
      - db-data-net
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  db-data:
